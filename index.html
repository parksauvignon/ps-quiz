<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Підбір квартири — ЖК «Парк Совіньйон»</title>
<meta name="description" content="Сім питань — і ми надішлемо підбірку квартир у комплексі «Парк Совіньйон»: планування, вільні поверхи та графік платежів.">
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Підберемо квартиру в «Парк Совіньйон» за 7 питань">
<meta property="og:description" content="Малоповерховий комплекс у власному парку біля моря. Відповідайте — надішлемо підбірку з цінами.">
<meta property="og:locale" content="uk_UA">
<link rel="preload" href="fonts/ProbaPro-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ProbaPro-Regular.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ════════════════════════════════════════════════════════════
   Квіз «Парк Совіньйон» — прототип
   Візуальний світ успадковано з лендингу єОселя:
   5 брендових кольорів, ProbaPro (400/500/600), без курсиву.
   ════════════════════════════════════════════════════════════ */
@font-face{font-family:'ProbaPro';src:url('fonts/ProbaPro-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'ProbaPro';src:url('fonts/ProbaPro-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'ProbaPro';src:url('fonts/ProbaPro-Bold.woff2') format('woff2');font-weight:600;font-display:swap}

:root{
  --olive:#999F4F; --olive-d:#68702F; --yellow:#F0CF4B; --yellow-d:#e2be34;
  --navy:#313746; --navy-d:#252a37; --gray:#6A7082; --cream:#F7F5F2; --white:#fff;
  --line:rgba(49,55,70,.12); --line-soft:rgba(49,55,70,.06);
  /* Матеріали фасаду ПС — лише для ілюстрації сцени, не бренд-акценти */
  --brick:#A85C48; --brick-d:#8E4A38; --ivory:#EFE7D9; --ivory-d:#DBD0BC;
  --glass:#DADCD6; --roof:#9E5340;
  --olive-tint:rgba(153,159,79,.13);
  --shadow:0 10px 30px rgba(49,55,70,.07);
  --shadow-l:0 26px 64px rgba(49,55,70,.14);

  --fs-h1:clamp(25px,3.4vw,40px);
  --fs-h3:clamp(19px,1.9vw,24px);
  --fs-lead:clamp(15px,1.3vw,17px);
  --fs-body:16px; --fs-sm:14px; --fs-xs:12px;
  --tr-head:-.018em; --tr-caps:.16em; --lh-head:1.14; --lh-body:1.6;

  --t-fast:.22s cubic-bezier(.2,.7,.2,1);
  --t-base:.5s cubic-bezier(.2,.7,.2,1);
  --t-slow:1.1s cubic-bezier(.2,.7,.2,1);

  --sky-a:#eef1f4; --sky-b:#F7F5F2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'ProbaPro',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:400;font-size:var(--fs-body);line-height:var(--lh-body);
  color:var(--navy);background:#fff;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  min-height:100svh;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{border:0;background:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--yellow);color:var(--navy)}
:focus-visible{outline:2px solid var(--olive-d);outline-offset:3px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(49,55,70,.2);border-radius:99px;border:3px solid #fff}
::-webkit-scrollbar-track{background:#fff}
input{caret-color:var(--olive-d)}

/* ── Шапка ───────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.hdr__in{display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:12px clamp(16px,3vw,32px)}
.hdr__logo img{height:30px;width:auto}
.hdr__meta{margin-left:auto;display:flex;align-items:center;gap:14px}
.hdr__time{font-size:var(--fs-xs);letter-spacing:.04em;color:var(--gray);white-space:nowrap}
@media(max-width:520px){.hdr__time{display:none}}
.hdr__tel{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--yellow);color:var(--navy);font-size:var(--fs-sm);font-weight:600;letter-spacing:.02em;white-space:nowrap;transition:background var(--t-fast),transform var(--t-fast)}
.hdr__tel:hover{background:var(--yellow-d)}
.hdr__tel:active{transform:translateY(1px)}
.hdr__tel svg{width:14px;height:14px;flex:none}

/* ── Прогрес ─────────────────────────────────────────────── */
.prog{position:sticky;top:54px;z-index:39;height:2px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--olive);transform:scaleX(var(--p,0));transform-origin:left;transition:transform var(--t-base)}

/* ── Каркас ──────────────────────────────────────────────── */
.stage{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,32px) 40px;
  display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
  column-gap:clamp(24px,4vw,64px);row-gap:0;align-items:start}
.scene-col{grid-column:1;grid-row:1}
.ask-col{grid-column:2;grid-row:1}
.scene-col .wish{margin-top:14px}
@media(max-width:940px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:none;row-gap:0;padding-bottom:24px}
  .scene-col{grid-column:1;grid-row:1}
  .ask-col{grid-column:1;grid-row:2}
  .wish{grid-column:1;padding:10px 16px 0}
}

/* ── Колонка сцени ───────────────────────────────────────── */
.scene-col{position:sticky;top:96px;padding-top:clamp(20px,4vw,48px)}
@media(max-width:940px){
  .stage{padding-left:0;padding-right:0}
  .scene-col{position:sticky;top:56px;padding-top:0;z-index:20;
    background:linear-gradient(180deg,#fff 78%,rgba(255,255,255,0))}
  .ask-col{padding-left:16px;padding-right:16px}
}
.scene-wrap{position:relative;border-radius:20px;overflow:hidden;background:var(--white);box-shadow:inset 0 0 0 1px var(--line-soft),var(--shadow)}
@media(max-width:940px){.scene-wrap{border-radius:0;box-shadow:none;background:transparent;
    -webkit-mask-image:linear-gradient(180deg,#000 84%,transparent);mask-image:linear-gradient(180deg,#000 84%,transparent)}}
.scene{display:block;width:100%;min-width:0;height:auto;aspect-ratio:640/440}
@media(max-width:940px){.scene{aspect-ratio:640/400;max-height:20svh}}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  background:var(--olive-tint);color:var(--olive-d);font-size:var(--fs-xs);font-weight:500;
  animation:chipIn .4s cubic-bezier(.2,.7,.2,1) both}
.chip button{color:inherit;opacity:.55;line-height:0;transition:opacity var(--t-fast)}
.chip button:hover{opacity:1}
.chip svg{width:11px;height:11px}
@keyframes chipIn{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}

/* ── Колонка питань ──────────────────────────────────────── */
.ask-col{padding-top:clamp(20px,4vw,48px);min-height:52svh}
@media(max-width:940px){.ask-col{padding-top:10px;min-height:0}}
.wish{display:flex;align-items:flex-start;gap:12px;padding:2px 16px 6px}
@media(min-width:941px){.wish{padding:6px 16px 2px}}
.wish__me{flex:none;width:128px;height:94px;margin-top:-8px}
.wish__t{position:relative;margin:0;padding:11px 14px;border-radius:14px 14px 14px 4px;
  background:var(--olive-tint);color:var(--navy);font-size:var(--fs-sm);line-height:1.5;text-wrap:pretty}
.wish__t.is-new{animation:wishIn .42s cubic-bezier(.2,.7,.2,1) both}
.wish__e{font:inherit;color:var(--olive-d);font-weight:500;padding:0;text-align:left;
  transition:color var(--t-fast)}
.wish__e span{border-bottom:1px dashed rgba(104,112,47,.5);transition:border-color var(--t-fast)}
.wish__e:hover{color:var(--navy)}
.wish__e:hover span{border-bottom-color:var(--navy)}
@keyframes wishIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:22px}
.step-no{font-size:var(--fs-xs);font-weight:500;letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--gray)}
.q{margin-top:10px;font-size:var(--fs-h1);font-weight:500;line-height:var(--lh-head);letter-spacing:var(--tr-head);max-width:22ch;text-wrap:balance}
.q .em{color:var(--olive-d)}
.sub{margin-top:12px;max-width:52ch;font-size:var(--fs-lead);color:var(--gray);text-wrap:pretty}

.opts{margin-top:22px;display:grid;gap:8px}
@media(max-width:940px){
  .opts{margin-top:12px;gap:6px}
  .opt{padding:10px 14px;gap:10px;font-size:15px;border-radius:12px}
  .opt__box{width:19px;height:19px;border-radius:6px}
  .opt__box svg{width:19px;height:19px}
  .q{margin-top:6px;font-size:22px;max-width:none}
  .sub{margin-top:6px;font-size:14px}
  .hint{margin-top:12px;padding:11px 13px;font-size:13px}
  .nav{margin-top:14px}
  .btn{padding:14px 24px}
  .resume{display:none}
  .wish__me{width:92px;height:68px}
  .wish__t{padding:10px 13px;font-size:13px}
}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 18px;border-radius:14px;background:var(--white);
  box-shadow:inset 0 0 0 1.5px rgba(153,159,79,.55);
  transition:box-shadow var(--t-fast),transform var(--t-fast),background var(--t-fast),color var(--t-fast)}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--olive);transform:translateX(3px)}
.opt:active{transform:translateX(3px) scale(.995)}
.opt.is-on{background:var(--olive);color:var(--white);box-shadow:inset 0 0 0 1.5px var(--olive)}
.opt.is-on .opt__box{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.opt.is-on .opt__box::after{background:var(--white)}
.opt.is-on .opt__box svg{color:var(--olive)}
.opt.is-on .opt__k{color:rgba(255,255,255,.75);opacity:1}
.opt__box{position:relative;flex:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.2px rgba(49,55,70,.22)}
.opt__box::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--olive);
  transform:scale(.4);opacity:0;transition:transform var(--t-fast),opacity var(--t-fast)}
.opt.is-on .opt__box::after{transform:scale(1);opacity:1}
.opt__box svg{position:relative;z-index:1;width:22px;height:22px;color:var(--white);opacity:0;transition:opacity var(--t-fast)}
.opt.is-on .opt__box svg{opacity:1}
.opt__t{flex:1;font-weight:500}
.opt__k{flex:none;width:20px;text-align:center;font-size:var(--fs-xs);color:var(--gray);opacity:.5}
@media(max-width:940px){.opt__k{display:none}}

.hint{display:flex;gap:12px;margin-top:20px;max-width:56ch;padding:14px 16px;border-radius:14px;
  background:var(--olive-tint);color:var(--navy);font-size:var(--fs-sm);line-height:1.55}
.hint svg{flex:none;width:17px;height:17px;margin-top:2px;color:var(--olive-d)}

.nav{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;
  padding:16px 28px;border-radius:999px;font-size:var(--fs-sm);font-weight:500;letter-spacing:.01em;white-space:nowrap;
  transition:background var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast),opacity var(--t-fast)}
.btn:active{transform:translateY(1px)}
.btn.-olive{background:var(--olive);color:var(--white)}
.btn.-olive:hover{background:var(--olive-d)}
.btn.-yellow{background:var(--yellow);color:var(--navy);font-weight:600}
.btn.-yellow:hover{background:var(--yellow-d)}
.btn.-line{box-shadow:inset 0 0 0 1px var(--line)}
.btn.-line:hover{box-shadow:inset 0 0 0 1px var(--navy)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.-full{width:100%}
.btn .arr{width:17px;height:1px;background:currentColor;position:relative;transition:width var(--t-fast);flex:none}
.btn .arr::after{content:'';position:absolute;right:0;top:-3px;width:7px;height:7px;border-right:1px solid currentColor;border-top:1px solid currentColor;transform:rotate(45deg)}
.btn:hover .arr{width:26px}
.back{display:inline-flex;align-items:center;gap:9px;font-size:var(--fs-sm);color:var(--gray);transition:color var(--t-fast)}
.back:hover{color:var(--navy)}
.back svg{width:14px;height:14px}

/* ── Екран контактів ─────────────────────────────────────── */


.form{margin-top:20px;display:grid;gap:10px}
.fld{position:relative}
.fld input{width:100%;padding:19px 18px 8px;border-radius:14px;background:var(--white);
  box-shadow:inset 0 0 0 1px var(--line);border:0;transition:box-shadow var(--t-fast)}
.fld input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--olive)}
.fld label{position:absolute;left:19px;top:14px;font-size:var(--fs-sm);color:var(--gray);pointer-events:none;
  transition:transform var(--t-fast),font-size var(--t-fast),color var(--t-fast);transform-origin:left top}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{transform:translateY(-8px) scale(.82);color:var(--olive-d)}
.fld.-err input{box-shadow:inset 0 0 0 2px #b4472f}
.err{display:none;margin:6px 0 0 4px;font-size:var(--fs-xs);color:#b4472f}
.fld.-err~.err,.err.is-on{display:block}

.ways{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.way{display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:999px;background:var(--white);
  box-shadow:inset 0 0 0 1px var(--line);font-size:var(--fs-sm);transition:box-shadow var(--t-fast),transform var(--t-fast)}
.way:hover{box-shadow:inset 0 0 0 1px rgba(49,55,70,.34)}
.way.is-on{box-shadow:inset 0 0 0 2px var(--olive)}
.way svg{width:16px;height:16px;color:var(--olive-d)}
.legal{margin-top:6px;font-size:var(--fs-xs);color:var(--gray);line-height:1.5;max-width:48ch}

/* ── Подяка ──────────────────────────────────────────────── */
.done__mark{width:54px;height:54px;border-radius:50%;background:var(--olive);display:grid;place-items:center;color:var(--white);
  animation:pop .55s cubic-bezier(.2,.7,.2,1) both}
.done__mark svg{width:26px;height:26px}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.done .q{margin-top:20px}
.nextsteps{margin-top:24px;display:grid;gap:2px}
.nextsteps div{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line-soft);font-size:var(--fs-sm)}
.nextsteps span{flex:none;width:18px;color:var(--olive-d);font-weight:500}

/* ── Відновлення сесії ───────────────────────────────────── */
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);font-size:var(--fs-sm)}
.resume b{font-weight:500}
.resume button{font-size:var(--fs-sm);font-weight:500;color:var(--olive-d);text-decoration:underline;text-underline-offset:3px}
.resume button.-mute{color:var(--gray);font-weight:400}

/* ── Поява кроку ─────────────────────────────────────────── */
.enter{animation:enter .42s cubic-bezier(.2,.7,.2,1) both}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.045s}
.enter>*:nth-child(3){animation-delay:.09s}
.enter>*:nth-child(4){animation-delay:.13s}
.enter>*:nth-child(5){animation-delay:.17s}
@keyframes enter{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ── Сцена: стани ────────────────────────────────────────── */
.scene .sky-a{stop-color:var(--sky-a)}
.scene .sky-b{stop-color:var(--sky-b)}
.scene g[data-layer]{opacity:0;transform:translateY(7px);transform-origin:center bottom;
  transition:opacity var(--t-base),transform var(--t-base)}
.scene g.is-on{opacity:1;transform:none}
.scene .draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);transition:stroke-dashoffset var(--t-slow)}
.scene g.is-on .draw{stroke-dashoffset:0}
.sunwrap{transform:translate(var(--sx,0px),var(--sy,0px));transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}
.win{fill:#D3DADE;transition:fill var(--t-base)}
.win.-lit{fill:#EFDCA0}
.scene text{font-family:'ProbaPro',system-ui,sans-serif}
.scene #flatplan{transition:opacity var(--t-fast)}
.ped-a{animation:pedIn 21s ease-in-out infinite}
.ped-b{animation:pedOut 26s ease-in-out infinite;animation-delay:-6s}
.ped-c{animation:pedPass 32s linear infinite;animation-delay:-14s}
@keyframes pedIn{
  0%{transform:translate(-40px,372px);opacity:0}
  4%{transform:translate(-10px,372px);opacity:.72}
  58%{transform:translate(410px,372px);opacity:.72}
  68%{transform:translate(410px,352px);opacity:0}
  100%{transform:translate(410px,352px);opacity:0}}
@keyframes pedOut{
  0%{transform:translate(282px,352px) scaleX(-1);opacity:0}
  8%{transform:translate(282px,352px) scaleX(-1);opacity:0}
  14%{transform:translate(282px,372px) scaleX(-1);opacity:.72}
  86%{transform:translate(-40px,372px) scaleX(-1);opacity:.72}
  92%{transform:translate(-70px,372px) scaleX(-1);opacity:0}
  100%{transform:translate(-70px,372px) scaleX(-1);opacity:0}}
@keyframes pedPass{
  0%{transform:translate(690px,374px) scaleX(-1);opacity:.62}
  100%{transform:translate(-50px,374px) scaleX(-1);opacity:.62}}
.sw-a,.sw-b{transform-box:fill-box;transform-origin:top center;animation:swing .62s ease-in-out infinite alternate}
.sw-b{animation-direction:alternate-reverse}
@keyframes swing{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
.scene .sc{display:none}
.scene[data-house="low"] .sc-low,.scene[data-house="high"] .sc-high,.scene[data-house="town"] .sc-town{display:block}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── Дебаг-панель (?debug=1) ─────────────────────────────── */
.dbg{position:fixed;right:12px;bottom:12px;z-index:90;width:min(340px,calc(100vw - 24px));max-height:46svh;overflow:auto;
  background:var(--navy-d);color:rgba(247,245,242,.8);border-radius:14px;padding:14px 16px;font-size:11px;line-height:1.5;box-shadow:var(--shadow-l)}
.dbg h4{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px}
.dbg table{width:100%;border-collapse:collapse}
.dbg td{padding:2px 0;vertical-align:top}
.dbg td:first-child{color:rgba(247,245,242,.5);width:52px}
.dbg td:last-child{text-align:right;color:rgba(247,245,242,.5);white-space:nowrap}
.dbg b{color:#fff;font-weight:500}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr__in">
    <a class="hdr__logo" href="https://park-sovinon.ua" target="_blank" rel="noopener" aria-label="Парк Совіньйон">
      <img src="img/logo.png" alt="Парк Совіньйон" width="1038" height="359">
    </a>
    <div class="hdr__meta">
      <span class="hdr__time" id="eta">7 питань · близько хвилини</span>
      <a class="hdr__tel" href="tel:+380675550000" onclick="track('phone_click',{place:'header'})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.8.8a2 2 0 0 1 1.7 2z"/></svg>
        Зателефонувати
      </a>
    </div>
  </div>
</header>

const ISO={ux:15,uy:7.5,wall:22};
const PLANS={
  smart:{w:5,h:3,rooms:[{t:'hall',x:0,y:0,w:2,h:1},{t:'bath',x:0,y:1,w:2,h:2},{t:'studio',x:2,y:0,w:3,h:3}]},

  '2':{w:6,h:4,rooms:[{t:'hall',x:0,y:0,w:2,h:1},{t:'bath',x:0,y:1,w:2,h:1},{t:'kitchen',x:0,y:2,w:2,h:2},{t:'living',x:2,y:0,w:4,h:2},{t:'bed',x:2,y:2,w:4,h:2}]},
  '3':{w:6,h:5,rooms:[{t:'hall',x:0,y:0,w:2,h:1},{t:'bath',x:0,y:1,w:2,h:1},{t:'kitchen',x:0,y:2,w:2,h:3},{t:'living',x:2,y:0,w:4,h:2},{t:'bed',x:2,y:2,w:2,h:3},{t:'bed',x:4,y:2,w:2,h:3}]}
};
const WET={bath:1,kitchen:1};
const FURN={
  hall:[[.12,.12,.34,.7,10,'#E4DDCE']],
  bath:[[.1,.12,.7,.42,7,'#EDF1F2'],[.1,.66,.28,.28,9,'#EDF1F2']],
  kitchen:[[.08,.08,.8,.24,11,'#E9E2D4'],[.3,.5,.4,.34,7,'#B9A98C']],
  living:[[.1,.12,.5,.24,8,'#9DA45C'],[.24,.46,.28,.22,5,'#B9A98C'],[.78,.2,.1,.44,10,'#6A7082']],
  bed:[[.12,.16,.5,.62,7,'#E7E1D3'],[.7,.16,.18,.2,8,'#B9A98C']],
  studio:[[.08,.08,.5,.2,11,'#E9E2D4'],[.14,.5,.44,.24,8,'#9DA45C'],[.72,.24,.12,.4,10,'#6A7082']]

const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*k),g=Math.round(((n>>8)&255)*k),b=Math.round((n&255)*k);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
const P=(x,y)=>[(x-y)*ISO.ux,(x+y)*ISO.uy];
const poly=(pts,fill,stroke,sw)=>`<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw||1}" stroke-linejoin="round"`:''}/>`;
function isoBox(x,y,w,d,h,c){
  const up=p=>[p[0],p[1]-h];
  const A=P(x,y),B=P(x+w,y),C=P(x+w,y+d),D=P(x,y+d);
  return poly([D,C,up(C),up(D)],shade(c,.78))+poly([C,B,up(B),up(C)],shade(c,.9))+poly([up(A),up(B),up(C),up(D)],c);
}
function renderPlan(){
  const g=document.getElementById('flatplan'); if(!g) return;
  const key=S.rooms==='?'?(S.randPlan||'2'):(S.rooms==='0'?'smart':S.rooms);
  const plan=PLANS[key]; if(!plan){g.innerHTML='';return;}
  const fit=S.fit||'none', done=fit==='repair'||fit==='full'||fit==='any';
  const floor=t=>done?(WET[t]?'#DCE1E3':'#E3D2B6'):'#C9CAC4';
  const wallC=done?'#F0EDE6':'#D8D9D3';
  let out='';
  plan.rooms.forEach(r=>{
    out+=poly([P(r.x,r.y),P(r.x+r.w,r.y),P(r.x+r.w,r.y+r.h),P(r.x,r.y+r.h)],floor(r.t),done?'#fff':'#BFC0BA',1.1);
  });
  // перегородки й зовнішні стіни — з унікальних ребер сітки
  const edges=new Map();
  plan.rooms.forEach(r=>{
    const add=(a,b,c,d)=>{const k=[a,b,c,d].join('|'); if(!edges.has(k)) edges.set(k,[a,b,c,d]);};
    add(r.x,r.y,r.x+r.w,r.y); add(r.x,r.y+r.h,r.x+r.w,r.y+r.h);
    add(r.x,r.y,r.x,r.y+r.h); add(r.x+r.w,r.y,r.x+r.w,r.y+r.h);
  });
  const T=.13, WH=13;
  [...edges.values()].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(([x1,y1,x2,y2])=>{
    out += (y1===y2) ? isoBox(x1,y1-T/2,x2-x1,T,WH,wallC) : isoBox(x1-T/2,y1,T,y2-y1,WH,wallC);
  });
  if(fit==='full'){
    const items=[];
    plan.rooms.forEach(r=>(FURN[r.t]||[]).forEach(f=>items.push([r.x+f[0]*r.w, r.y+f[1]*r.h, f[2]*r.w, f[3]*r.h, f[4], f[5]])));
    items.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(f=>{out+=isoBox(f[0],f[1],f[2],f[3],f[4],f[5]);});
  }
  const tx=96-(plan.w-plan.h)*ISO.ux/2, ty=182-(plan.w+plan.h)*ISO.uy/2+ISO.wall/2;
  g.innerHTML=`<g transform="translate(${tx.toFixed(1)},${ty.toFixed(1)})">${out}</g>`;
  document.getElementById('flatperson').style.opacity = S.rooms==='?'?'1':'0';
}

/* ── Речення «Я хочу…» з відповідей ─────────────────────
   Кожен фрагмент — кнопка: клік повертає до свого питання. */
function wishParts(){
  const idx=id=>Q.findIndex(q=>q.id===id);
  const seg=(id,txt)=>({id,txt,i:idx(id)});
  const ph=(id,v)=>optOf(id,v).ph;
  const many=id=>(ans[id]||[]).map(v=>ph(id,v)).filter(Boolean);
  const one=id=>ans[id]?ph(id,ans[id]):null;
  const out=[{txt:'Я хочу квартиру'}];
  const dis=many('district'); if(dis.length){ out.push({txt:' '}); out.push(seg('district',dis.join(' або '))); }
  const f=one('flat'), fi=one('fit');
  if(f){ out.push({txt:out.length>1?', ':' '}); out.push(seg('flat',f)); }
  if(fi){ out.push({txt:' '}); out.push(seg('fit',fi)); }
  const st=one('stage'); if(st){ out.push({txt:', '}); out.push(seg('stage',st)); }
  out.push({txt:'.'});
  const h=ans.house;
  if(h){ out.push({txt:h==='town'?' Хочу ':' Хочу, щоб це був '}); out.push(seg('house',ph('house',h))); out.push({txt:'.'}); }
  const val=many('value'); if(val.length){ out.push({txt:' Для мене важливо: '}); out.push(seg('value',val.join(', '))); out.push({txt:'.'}); }
  const t=many('time'); if(t.length){ out.push({txt:' Звʼяжіться зі мною '}); out.push(seg('time',t.join(' або '))); out.push({txt:'.'}); }
  return out;
}
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function renderWish(){
  const box=document.getElementById('wish'); if(!box) return;
  const any=Object.keys(ans).some(k=>k!=='way'&&(Array.isArray(ans[k])?ans[k].length:ans[k]));
  box.hidden=!any; if(!any) return;
  const parts=wishParts(); let html='';
  parts.forEach((p,i)=>{
    if(!p.id){ if(!p.used) html+=esc(p.txt); return; }
    const nx=parts[i+1];
    let tail='';
    if(nx && !nx.id && /^[.,]/.test(nx.txt)){ tail=nx.txt[0]; nx.txt=nx.txt.slice(1); }
    html+=`<button type="button" class="wish__e" data-i="${p.i}"><span>${esc(p.txt)}</span>${esc(tail)}</button>`;
  });
  const t=box.querySelector('.wish__t');
  if(t.dataset.h!==html){ t.dataset.h=html; t.innerHTML=html; t.classList.remove('is-new'); void t.offsetWidth; t.classList.add('is-new'); }
}

  const sel = ans[q.id] || (q.multi?[]:null);
  const isOn = v => q.multi ? sel.includes(v) : sel===v;
  card.className='enter'; card.innerHTML = `
    <div class="step-head">
      <span class="step-no">Питання ${step+1} з ${Q.length}</span>
      ${step>0?`<button class="back" id="back">${ICO.back}Назад</button>`:''}
    </div>
    <h1 class="q">${q.q}</h1>
    ${q.sub?`<p class="sub">${q.sub}</p>`:''}
    <div class="opts" role="group">
      ${q.opts.map((o,i)=>`
        <button class="opt ${q.multi?'-multi':''} ${isOn(o.v)?'is-on':''}" data-i="${i}">
          <span class="opt__box">${ICO.check}</span>
          <span class="opt__t">${o.t}</span>
          <span class="opt__k">${i+1}</span>
        </button>`).join('')}
    </div>
    ${q.hint?`<div class="hint">${ICO.info}<span>${q.hint}</span></div>`:''}
    ${q.multi?`<div class="nav"><button class="btn -olive" id="next" ${sel.length?'':'disabled'}>Далі<i class="arr"></i></button></div>`:''}`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(q,+b.dataset.i));
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>go(step+1);
  const bk=document.getElementById('back'); if(bk) bk.onclick=()=>{track('quiz_back',{step:step+1});go(step-1)};
  track('quiz_step_view',{step:step+1,question:q.id});
  if(!started){started=true;track('quiz_start',UTM);}
}

function pick(q,i){
  const o=q.opts[i];
  if(navigator.vibrate) navigator.vibrate(8);
  if(q.multi){
    const cur=ans[q.id]||[]; const on=cur.includes(o.v);
    ans[q.id]= on ? cur.filter(v=>v!==o.v) : cur.concat(o.v);
    Object.assign(S,o.s||{});
    if(on && o.s) Object.keys(o.s).forEach(k=>{ if(typeof S[k]==='number') S[k]=0; });
    card.querySelectorAll('.opt')[i].classList.toggle('is-on',!on);
    const nb=document.getElementById('next'); if(nb) nb.disabled = !ans[q.id].length;
    paint(); renderWish(); save();
    track('quiz_answer',{step:step+1,question:q.id,value:o.v,multi:true,ms:Date.now()-stepAt});
  } else {
    ans[q.id]=o.v; Object.assign(S,o.s||{});
    card.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('is-on',j===i));
    paint(); renderWish(); save();
    track('quiz_answer',{step:step+1,question:q.id,value:o.v,ms:Date.now()-stepAt});
    setTimeout(()=>go(step+1),260);
  }
}
function go(n){ step=Math.max(0,Math.min(Q.length,n)); render(); }



/* ── Екран контактів ─────────────────────────────────────── */
function renderContact(){
  card.className='enter'; card.innerHTML=`
    <div class="step-head">
      <span class="step-no">Останній крок</span>
      <button class="back" id="back">${ICO.back}Назад</button>
    </div>
    <h1 class="q">Залиште <span class="em">свої контакти</span></h1>
    <form class="form" id="lead" novalidate>
      <div class="fld" id="f-name"><input id="name" name="name" placeholder=" " autocomplete="given-name" required><label for="name">Ваше ім’я</label></div>
      <div class="fld" id="f-phone"><input id="phone" name="phone" type="tel" inputmode="numeric" placeholder=" " autocomplete="tel" value="+380"><label for="phone">Телефон</label></div>
      <div class="err" id="err"></div>
      <div class="ways" id="ways">
        <button type="button" class="way is-on" data-w="telegram">${ICO.plane}Telegram</button>
        <button type="button" class="way" data-w="viber">${ICO.chat}Viber</button>
        <button type="button" class="way" data-w="whatsapp">${ICO.chat}WhatsApp</button>
        <button type="button" class="way" data-w="call">${ICO.call}Дзвінок</button>
      </div>
      <button class="btn -yellow -full" type="submit" id="send" style="margin-top:8px">Відправити форму<i class="arr"></i></button>
      <p class="legal">Натискаючи кнопку, ви погоджуєтесь на обробку персональних даних. Дані нікому не передаються.</p>
    </form>
`;
  document.getElementById('back').onclick=()=>{track('quiz_back',{step:Q.length+1});go(step-1)};
  const ways=document.getElementById('ways');
  ways.onclick=e=>{const b=e.target.closest('.way'); if(!b)return;
    ways.querySelectorAll('.way').forEach(x=>x.classList.toggle('is-on',x===b));
    ans.way=b.dataset.w; track('quiz_answer',{step:Q.length+1,question:'way',value:b.dataset.w});};
  ans.way=ans.way||'telegram';
  const ph=document.getElementById('phone');
  ph.addEventListener('input',()=>{let d=ph.value.replace(/\D/g,'');if(d.startsWith('380'))d=d.slice(3);ph.value='+380'+d.slice(0,9);});
  ph.addEventListener('focus',()=>{if(!ph.value)ph.value='+380';track('quiz_phone_focus',{})},{once:true});
  document.getElementById('lead').onsubmit=submit;
  track('quiz_contact_view',{answers:Object.keys(ans).length});
}

function submit(e){
  e.preventDefault();
  const name=document.getElementById('name'), phone=document.getElementById('phone'), err=document.getElementById('err');
  const digits=phone.value.replace(/\D/g,'');
  document.getElementById('f-name').classList.toggle('-err',!name.value.trim());
  document.getElementById('f-phone').classList.toggle('-err',digits.length!==12);
  if(!name.value.trim()||digits.length!==12){
    err.className='err is-on';
    err.textContent = !name.value.trim() ? 'Вкажіть ім’я — щоб менеджер знав, як до вас звертатися.' : 'Номер має містити 9 цифр після +380.';
    track('quiz_validation_error',{field:!name.value.trim()?'name':'phone'});
    return;
  }
  const btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Надсилаємо…';
  const note=buildNote(name.value.trim());
  track('quiz_submit',{way:ans.way,rooms:ans.flat,stage:ans.stage});
  if(typeof fbq==='function') fbq('track','Lead',{content_name:'quiz'});
  if(CONFIG.crm.enabled){
    fetch(CONFIG.crm.url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({action:'partner-custom-form',token:CONFIG.crm.token,partner_id:CONFIG.crm.partnerId,
        name:name.value.trim(),phone:'+'+digits,lang:'ua',note:note,adv_id:'quiz'}).toString()}).catch(()=>{});
  } else { console.log('[quiz] CRM вимкнено (прототип). Note:\n'+note); }
  localStorage.removeItem(KEY);
  renderDone(name.value.trim());
}

function buildNote(name){
  const L=['КВІЗ META'];
  Q.forEach(q=>{const a=ans[q.id]; if(!a)return;
    const vals=Array.isArray(a)?a:[a];
    L.push(q.q+' — '+vals.map(v=>(q.opts.find(o=>o.v===v)||{}).t).join(', '));});
  L.push('Спосіб зв’язку — '+(ans.way||'—'));
  if(Object.keys(UTM).length) L.push('UTM: '+new URLSearchParams(UTM).toString());
  return L.join('\n');
}

function renderDone(name){ /* ім'я не вставляємо в звертання: кличний відмінок не автоматизується */
  const times=(ans.time||[]).map(v=>optOf('time',v).ph).join(', ');
  document.getElementById('progbar').style.setProperty('--p','1');
  document.getElementById('eta').textContent='Готово';
  document.getElementById('wish').hidden=true;
  card.className='enter done'; card.innerHTML=`
    <div class="done__mark">${ICO.check}</div>
    <h1 class="q">Дякуємо! Форму <span class="em">отримали</span>.</h1>
    <div class="nextsteps">
      <div><span>1</span><p>${times?`Звʼяжемося з вами у вибраний час: ${times}.`:'Звʼяжемося з вами у робочий час, пн–нд.'}</p></div>
      <div><span>2</span><p>Якщо захочете подивитись наживо — покажемо квартиру у зручний для вас день.</p></div>
    </div>
    <div class="nav">
      <a class="btn -olive" href="${CONFIG.botUrl}" target="_blank" rel="noopener" onclick="track('bot_click',{})">Поставити питання боту<i class="arr"></i></a>
      <a class="btn -line" href="${CONFIG.siteUrl}" target="_blank" rel="noopener" onclick="track('site_click',{})">Подивитись комплекс</a>
    </div>`;
  S.stage='ready'; paint();
  track('quiz_done',{});
}

/* ── Збереження / відновлення ───────────────────────────── */
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({step,ans,S})); }catch(e){} }
function restore(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!d||!d.step) return false;
  const box=document.getElementById('resume');
  box.innerHTML=`<div class="resume"><b>Ви зупинились на питанні ${Math.min(d.step+1,Q.length)}.</b>
    <button id="r-yes">Продовжити</button><button id="r-no" class="-mute">Почати спочатку</button></div>`;
  document.getElementById('r-yes').onclick=()=>{step=d.step;ans=d.ans||{};Object.assign(S,d.S||{});box.innerHTML='';track('quiz_resume',{step:d.step+1});render();};
  document.getElementById('r-no').onclick=()=>{localStorage.removeItem(KEY);box.innerHTML='';track('quiz_restart',{});};
  return false;
}

/* ── Клавіатура ──────────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(step>=Q.length) return;
  const q=Q[step];
  if(/^[1-9]$/.test(e.key)){ const i=+e.key-1; if(i<q.opts.length){ pick(q,i); } }
  if(e.key==='Enter'&&q.multi&&(ans[q.id]||[]).length) go(step+1);
  if(e.key==='Backspace'&&!/input/i.test(e.target.tagName)&&step>0){ e.preventDefault(); go(step-1); }
});

/* ── Дебаг ───────────────────────────────────────────────── */
function renderDbg(){
  let el=document.getElementById('dbg');
  if(!el){ el=document.createElement('div'); el.id='dbg'; el.className='dbg'; document.body.appendChild(el); }
  el.innerHTML=`<h4>Події квіза (${EVENTS.length})</h4><table>${EVENTS.slice(-16).map(e=>
    `<tr><td>${(e.t/1000).toFixed(1)}с</td><td><b>${e.name}</b> ${e.p.question||e.p.value||''}</td><td>${e.p.ms?Math.round(e.p.ms/100)/10+'с':''}</td></tr>`).join('')}</table>`;
}

/* ── Блок думки: під сценою на десктопі, у кінці — на мобільному ── */
const mqNarrow=window.matchMedia('(max-width:940px)');
function placeWish(){
  const w=document.getElementById('wish'); if(!w) return;
  const host=mqNarrow.matches?document.querySelector('.stage'):document.querySelector('.scene-col');
  if(w.parentElement!==host) host.appendChild(w);
}
mqNarrow.addEventListener('change',placeWish);

/* ── Старт ───────────────────────────────────────────────── */
placeWish(); restore(); render(); if(DEBUG) renderDbg();
</script>
</body>
</html>
